<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - MyRealSurveys (Mobile)</title>
    <link rel="stylesheet" href="css/login_mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <script type="module" src="js/login_mobile.js" defer></script>
</head>
<body>
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <main class="main-content">
        <div class="form-container">
            <div id="loginSection">
                <h2>Login</h2>
                <p>Sign in to start earning.</p>
                <form id="loginForm">
                    <label for="email" class="sr-only">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required aria-label="Email">

                    <label for="password" class="sr-only">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required aria-label="Password">

                    <button type="submit" class="submit-btn">Login</button>
                    <a href="#" id="forgotPasswordLink" class="form-link">Forgot Password?</a>
                    <div id="loginMessage" class="message" aria-live="polite"></div>
                </form>
            </div>

            <div id="forgotPasswordSection" class="forgot-password-section" style="display: none;">
                <h2>Reset Password</h2>
                <p>Enter your email to receive a reset link.</p>
                <div class="reset-form-container">
                    <label for="resetEmail" class="sr-only">Email for password reset</label>
                    <input type="email" id="resetEmail" name="resetEmail" placeholder="Your Email" required aria-label="Email for password reset">
                    <button type="button" id="resetPasswordBtn" class="submit-btn">Send Reset Link</button>
                    <a href="#" id="backToLoginLink" class="form-link back-to-login">Back to Login</a>
                    <div id="resetMessage" class="message" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 MyRealSurveys. All Rights Reserved.</p>
    </footer>
</body>
</html>
