<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2675ea" />
    <meta
      name="description"
      content="A little of your time. A lot of honest feedback. Explore the MyRealSurveys preview: ten thoughtful questions and a planned one-dollar reward."
    />
    <title>One good conversation — MyRealSurveys</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/site.css" />
    <script type="module" src="js/site.js"></script>
    <script type="module" src="js/survey.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <div class="shell nav">
        <a class="brand" href="index.html" aria-label="MyRealSurveys home"
          ><img src="assets/favicon.svg" width="35" height="35" alt="" /><span
            class="brand-word"
            >myrealsurveys.</span
          ></a
        >
        <nav class="nav-links" id="navigation" aria-label="Main navigation">
          <a href="surveys.html">Find a survey</a
          ><a href="index.html#how">How it works</a
          ><a href="index.html#why">Our promise</a
          ><a class="nav-login" data-account-link href="login.html">Log in</a>
        </nav>
        <div class="nav-actions">
          <a data-account-link href="login.html">Log in</a
          ><a class="button small" href="surveys.html">Explore surveys</a>
        </div>
        <button
          class="menu-toggle"
          data-menu-toggle
          aria-expanded="false"
          aria-controls="navigation"
        >
          Menu
        </button>
      </div>
    </header>
    <main id="main" class="survey-shell">
      <div class="survey-topline">
        <a class="text-link" href="surveys.html">Close survey</a>
        <div class="survey-brand" id="surveyBrand"></div>
        <span>Sample · $1 planned</span>
      </div>
      <div class="animation-toolbar">
        <button class="motion-control" data-motion aria-pressed="false">
          Pause animations
        </button>
      </div>
      <div id="runner">
        <div class="progress-caption">
          <span id="questionCount">Question 1 of 10</span
          ><span id="progressCaption">Your perspective matters.</span>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Survey progress"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-valuenow="0"
          id="surveyProgress"
        >
          <div class="progress-fill" id="progressBar"></div>
        </div>
        <form id="surveyForm">
          <div id="questionRoot"></div>
          <div class="question-actions">
            <button class="quiet-button" type="button" id="backButton">
              Back</button
            ><button class="button" type="submit" id="nextButton">
              Continue
            </button>
          </div>
          <div class="status error" id="surveyError" role="alert" hidden></div>
        </form>
        <p class="survey-footnote">
          This is a preview. Answers stay on this page and aren’t sent to a
          company.
        </p>
      </div>
      <section
        id="completion"
        class="completion"
        hidden
        aria-live="polite"
      ></section>
    </main>
    <noscript
      ><p class="shell status error">
        Please enable JavaScript to try the interactive survey preview.
      </p></noscript
    >
  </body>
</html>
