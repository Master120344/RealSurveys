<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MyRealSurveys</title>
    <link rel="stylesheet" href="css/register_desktop.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script type="module" src="js/register_desktop.js" defer></script>
    <script type="module" src="js/ticker.js" defer></script>
</head>
<body>
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <header class="parallax-header">
        <div class="header-overlay">
            <div class="ticker-container">
                <div id="survey-ticker" class="survey-ticker">Loading survey platform insights... <a href="survey-news.html" class="ticker-link">Learn More</a></div>
            </div>
            <div class="header-content">
                <img src="assets/logo.png" alt="MyRealSurveys Logo" class="logo" id="logo">
                <h1 class="header-title">MyRealSurveys</h1>
            </div>
            <div id="particles-js" class="particles-bg"></div>
        </div>
    </header>

    <nav id="nav" class="sticky-nav">
        <div class="nav-container">
            <button class="nav-btn" data-href="index_desktop.html">Home</button>
            <button class="nav-btn" data-href="contact_desktop.html">Contact</button>
            <button class="nav-btn" data-href="giveaways_desktop.html">Giveaways</button>
            <button class="nav-btn" data-href="register_desktop.html">Register</button>
            <button class="nav-btn" data-href="login_desktop.html">Login</button>
            <button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="main-content" data-aos="fade-up">
        <div class="form-container">
            <h2>Register</h2>
            <p>Create an account to start earning.</p>
            <form id="registerForm">
                <label for="email" class="sr-only">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required aria-label="Email">

                <div class="password-container">
                    <label for="password" class="sr-only">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required aria-label="Password">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="password-strength" class="strength-bar">
                    <div class="strength-level"></div>
                </div>
                <div id="password-feedback" class="feedback-message"></div>

                <div class="password-container">
                    <label for="confirmPassword" class="sr-only">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required aria-label="Confirm Password">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="confirm-password-feedback" class="feedback-message"></div>

                <button type="submit" class="submit-btn">Sign Up</button>
                <div id="registerMessage" class="message" style="display: none;" aria-live="polite"></div>
            </form>
            <p class="login-link">Already have an account? <a href="login_desktop.html">Login here</a></p>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 MyRealSurveys. All Rights Reserved.</p>
    </footer>
</body>
</html>
