<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance - MyRealSurveys</title>
    <link rel="stylesheet" href="css/balance.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script type="module" src="js/balance.js" defer></script>
</head>
<body>
    <!-- Parallax Header -->
    <header class="parallax-header">
        <div class="header-overlay">
            <div class="header-content">
                <img src="assets/logo.png" alt="MyRealSurveys Logo" class="logo" id="logo">
                <h1 class="header-title">MyRealSurveys</h1>
            </div>
            <div id="particles-js" class="particles-bg"></div>
        </div>
    </header>

    <!-- Navigation -->
    <nav id="nav" class="sticky-nav">
        <div class="nav-container">
            <button class="nav-btn" data-href="index.html">Home</button>
            <button class="nav-btn" data-href="surveys.html">Surveys</button>
            <button class="nav-btn" data-href="contact.html">Contact</button>
            <div class="user-info">
                <span id="user-email"></span>
                <button id="logout-btn" class="nav-btn logout-btn">Logout</button>
            </div>
            <button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" data-aos="fade-up">
        <section class="balance-section">
            <h2>Your Balance</h2>
            <div class="balance-container" data-aos="zoom-in">
                <h3>Current Balance:</h3>
                <div class="balance-info">
                    <p class="balance-amount" id="current-balance">$0.00</p>
                </div>
                <div class="cashout-options">
                    <div id="cashout-step-1" class="cashout-step">
                        <h3>Step 1: Enter Amount</h3>
                        <input type="number" id="cashout-amount" placeholder="Enter amount" step="0.01" min="1" />
                        <p id="net-amount" class="net-amount"></p>
                        <button class="cashout-btn" id="cashout-btn">Next</button>
                    </div>
                    <div id="cashout-step-2" class="cashout-step hidden">
                        <h3>Step 2: Payment Details</h3>
                        <form id="payment-form">
                            <div id="card-element"></div>
                            <div id="card-errors" role="alert"></div>
                            <button type="submit" id="pay-button">Cash Out</button>
                        </form>
                        <p id="fee-info">10% processing fee applies.</p>
                    </div>
                    <div id="cashout-step-3" class="cashout-step hidden">
                        <h3>Step 3: Confirmation</h3>
                        <p id="confirmation-message">Processing...</p>
                        <p>Funds arriving soon!</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Powered by <a href="https://stripe.com" target="_blank">Stripe</a></p>
        <img src="https://github.com/Master120344/RealSurveys/raw/main/assets/untitled-3.gif" alt="Stripe Logo" class="stripe-logo">
    </footer>
</body>
</html>
