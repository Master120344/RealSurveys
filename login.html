<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — MyRealSurveys</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/site.css"><script type="module" src="js/login.js"></script></head><body><main class="auth"><section class="authbrand"><a class="brand" href="index.html"><span class="mark">MRS</span>MyRealSurveys</a><div><span class="eyebrow">Welcome back</span><h1>Your voice.<br><span>Your account.</span></h1><p>Sign in to access available surveys, manage your account, and keep track of your balance.</p></div><p>Clear rewards · focused surveys · one account</p></section><section class="authpanel"><div class="authbox"><h2>Sign in</h2><p class="sub">Use the email and password tied to your account.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit" style="width:100%">Sign in</button><div id="loginMessage" class="status" hidden></div></form><div class="card" style="margin-top:18px"><form id="resetForm"><div class="field"><label for="resetEmail">Forgot password?</label><input id="resetEmail" name="resetEmail" type="email" placeholder="Email address" required></div><button class="btn secondary" type="submit">Send reset email</button><div id="resetMessage" class="status" hidden></div></form></div><p class="authswitch">New here? <a class="textlink" href="register.html">Create an account</a></p></div></section></main></body></html>
