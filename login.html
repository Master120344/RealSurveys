<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — MyRealSurveys</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/site.css"><script type="module" src="js/login.js"></script></head><body><main class="auth"><section class="authbrand"><a class="brand" href="index.html"><span class="mark">MRS</span>MyRealSurveys</a><div><span class="eyebrow">Welcome back</span><h1>Sign in and<br><span>keep going.</span></h1><p>Access your surveys, account balance, and account settings from one place.</p></div><p>Simple surveys · clear rewards · one account</p></section><section class="authpanel"><div class="authbox"><h2>Sign in</h2><p class="sub">Enter the email and password you used to create your account.</p><form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required></div><button class="btn primary" type="submit" style="width:100%">Sign in</button><div id="loginMessage" class="status" hidden></div></form><div style="margin-top:24px;padding-top:22px;border-top:1px solid var(--line)"><form id="resetForm"><div class="field"><label for="resetEmail">Forgot your password?</label><input id="resetEmail" name="resetEmail" type="email" placeholder="Enter your email" required></div><button class="btn secondary" type="submit">Send reset email</button><div id="resetMessage" class="status" hidden></div></form></div><p class="authswitch">Need an account? <a class="textlink" href="register.html">Create one free</a></p></div></section></main></body></html>
